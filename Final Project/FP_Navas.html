    Description: This web application is a task manager that allows all users to add, remove, or edit their tasks of the day.
    This project was created with 2 files using HTML and JavaScript. I decided to use 2 separate files for readability purposes.
-->
    
<!DOCTYPE html>
<html>
    <head>
        <title>Task Manager</title>
    </head>
    <body>

        <div style="text-align: center;">
            <h1>Task Manager</h1>
        </div>
        <!--Creating the style with a different background color-->
        <style>
            body 
            {
                font-family: Arial, sans-serif;
                margin: 20px;
                padding: 10px;
            }
  
            #taskmanager 
            {
                margin-top: 20px;
            }
  
            .task 
            {
                padding: 10px;
                margin-bottom: 10px;
                border: 1px solid #be6c6c;
                border-radius: 5px;
            }
            
            /* Set the color to red for High importance*/
            .high
            {
                background-color: #de0404;
            }
            /* Bronze-ish color for Medium importance*/
            .medium 
            {
                background-color: #b96c1a;
            }
            /*Sky Blue for low importance*/
            .low 
            {
                background-color: #1fbce8;
            }
  
            .important 
            {
                color: rgb(247, 214, 1);
            }
  
            .completed 
            {
                text-decoration: line-through;
                color: gray;
            } 
        </style>

        <!--
            The following lines will display the the options for the user to select the priorities for 
            each task and if they have been completed.
        -->
        <form id="taskForm" style="text-align: center;">
            <input type="text" id="taskName" placeholder="Enter task name" required>
            <select id="taskPriority">
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
            </select>
    
            <label>
                <input type="checkbox" id="Important">
                Important
            </label>

            <label>
                <input type="checkbox" id="Completed">
                Completed
            </label>

            <button type="submit">Add Task</button>
        </form>

        <div id="taskmanager"></div>

        <script src="FP_Navas.js" defer></script>
    </body>
</html>
